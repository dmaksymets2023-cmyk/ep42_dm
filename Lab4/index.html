<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab4</title>
</head>

<body>
    <header>
        <h1>
            Картка Студента
        </h1>
    </header>
    <main>
        <section>
            <form action=".">
                <h2>Personal Information</h2>
                <fieldset>
                    <legend>Provide your details</legend>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="fullname">
                    <br>
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <br>
                    <br>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                    <br>
                    <br>
                    <label for="number">Number:</label>
                    <input type="number" id="number" name="number">
                    <br>
                    <br>
                    <label for="date">Date of Birth:</label>\
                    <input type="date" id="date" name="date">
                    <br>
                    <br>
                    <label for="radio">Gender:</label>
                    <br>
                    <label for="Male">Male</label>
                    <input type="radio" id="Male" name="gender">
                   
                    
                    
                    
                    <!--
                    Date Input (<input type="date">) - Date of Birth
                    Radio Buttons (<input type="radio">) - Gender (Male, Female, Other)
                    Checkboxes (<input type="checkbox">) - Languages Known (English,Spanish, French)
                    Select Box (<select>) - Country -->
                    
                </fieldset>
                <input type="submit">
            </form>
        </section>

    </main>


</body>

</html>
